name: Build and deploy Node.js project to Azure Function App - nexora-api-group10

on:
  push:
    branches:
      - 'main'
    paths:
      - 'api/**'
      - '.github/workflows/main_nexora-api-group10.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'api'
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies and build
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          popd

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: api/

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: api/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4698185F75EB4CE48A688D8146FA665F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7485D99253244D8D9888B75F55A5339E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_50C6CDBB88494109B3C79EC52B9CAA44 }}

      - name: Deploy API to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'nexora-api-group10'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
